<text x="30" y="816" font-size="12" fill="#333">[推測] ドライブの電源（基板の上の Molex）とカードエッジの位置は D3126 の写真の左下（後ろ）と説明から描いた。コントローラの J1 / J3 と U9 の前後の位置も写真からの目安 [/推測]</text>
<text x="30" y="834" font-size="12" fill="#333">[要確認] 各段の高さ、すき間、コネクタの端からの寸法（ノギスで測る） [/要確認]</text>
