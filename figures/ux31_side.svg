<svg xmlns="http://www.w3.org/2000/svg" width="1252" height="850" viewBox="0 0 1252 850" font-family="sans-serif">
<rect width="1252" height="850" fill="#ffffff"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#455a64"/></marker></defs>
<text x="30" y="36" font-size="22" font-weight="bold">PC-9801UX-31 を横から見た図（2026-11-02、寸法は 2026-11-04）</text>
<text x="30" y="60" font-size="13" fill="#333">左が本体の前、右が後ろ。3 段の間は広げて描いた。寸法の数字は測定（2026-11-04）。</text>
<text x="30" y="78" font-size="13" fill="#333">数字のない位置（ドライブ、各段の高さなど）は写真（docs/photos/ux31_*.jpg）から読んだ概略。</text>
<text x="30" y="96" font-size="13" fill="#333">色は中のバスの図と同じ: 青 = C-bus（P2）、橙 = SASI（P1、50 ピン）、緑 = ST-506、灰 = 外付けの J7、桃 = 電源。基板は薄茶、寸法は青灰。</text>
<line x1="90.0" y1="160" x2="90.0" y2="780" stroke="#999" stroke-width="3"/>
<text x="80.0" y="180" font-size="13" text-anchor="end" fill="#555">前</text>
<line x1="922.0" y1="160" x2="922.0" y2="780" stroke="#999" stroke-width="3"/>
<text x="932.0" y="180" font-size="13" fill="#555">後ろ（背面）</text>
<rect x="90.0" y="700" width="832.0" height="10" fill="#e8e2cf" stroke="#333" stroke-width="1.5"/>
<text x="106.0" y="750" font-size="15" font-weight="bold">UX のマザーボード</text>
<rect x="158" y="678" width="24" height="22" fill="#9ec5f8" stroke="#333" stroke-width="1.2"/>
<text x="170" y="715" font-size="12" text-anchor="middle"></text>
<text x="370.0" y="694" font-size="12">マザーボードの P2（40 ピン、オスのボックスヘッダ、上向き）</text>
<line x1="170" y1="710" x2="170" y2="724" stroke="#455a64" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="170" y1="724" x2="922" y2="724" stroke="#455a64" stroke-width="1.3" marker-end="url(#d)" marker-start="url(#d)"/>
<text x="546" y="720" font-size="12" font-weight="bold" fill="#455a64" text-anchor="middle">P2 の中心 → 背面 188 mm（146.5 + 41.5。前の測定の約 18 cm と合う）</text>
<rect x="138" y="604" width="618" height="10" fill="#e8e2cf" stroke="#333" stroke-width="1.5"/>
<text x="202" y="578" font-size="15" font-weight="bold">1 段目: ホストアダプタ</text>
<text x="202" y="596" font-size="12" fill="#333">はんだ面が上、部品面（IC と P2 のメス）が下。P2 は前の端、P1 は後ろの端</text>
