<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="574" viewBox="0 0 1160 574" font-family="sans-serif">
<rect width="1160" height="574" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#000">PC-9801UX-31 P2（40 ピン）のピン配置（インターフェース側から見た図、2026-10-25）</text>
<text x="40" y="60" font-size="13" fill="#333">番号は数え方。上から見た図の左右反転。上の列が 40〜21 番、下の列が 20〜1 番。括弧内は UX-31 のつながり先。</text>
<text x="40" y="78" font-size="13" fill="#333">信号はマザーボード側の C-bus / 8237 との導通で確認。* 36 番は UX-31 側で GND、マザーボード側では SASI_CONFIG#。</text>
<text x="40" y="96" font-size="13" fill="#333">39 番はマザーボード側で 220 Ω を通して P3-3（前面の DISK の LED のカソード。アノードは +5 V）へ。L で点く（2026-11-24）。</text>
