<text x="800" y="905" font-size="10" text-anchor="start" fill="#333">74LS244 は反転しないバッファ。MRC# は MRC0 と同じ向き（L でメモリの読み出し）。</text>
<text x="800" y="921" font-size="10" text-anchor="start" fill="#333">ROMRD = 1 は「窓の番地のメモリの読み出し中」。NOR を、入力に ○ の付いた AND（正論理）として描いた。</text>
<text x="800" y="937" font-size="10" text-anchor="start" fill="#a00000">推測: 5C（74LS00）で BHE0、AB0 と組み合わせ、偶数と奇数のバイトのデータバッファを開く。</text>
