<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" font-family="sans-serif">
<rect width="1500" height="1010" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" text-anchor="start" fill="#000">PC-9801-27: BIOS ROM の選択と読み出し（導通で確認、2026-10-29。解析結果（findings）の「PC-9801-27 の SASI BIOS」の「ROM の選択」を図にしたもの）</text>
<text x="20" y="52" font-size="12" text-anchor="start" fill="#333">ROM のまわりだけを描く（SASI 側はまだ調べていない）。名前の後ろの # は L で有効（負論理）。C-bus の信号は末尾の 0 が負論理。○ は反転。色の付いた名前は、同じ名前どうしがつながるネット。灰色の文字は IC の位置とピン番号。</text>
<rect x="20" y="62" width="12" height="12" fill="#167a2e"/>
