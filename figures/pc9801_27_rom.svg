<text x="800" y="345" font-size="12" font-weight="bold" text-anchor="start" fill="#000">設定ごとの 0 ビット目（LA12 = ラッチした AB12）</text>
<text x="800" y="368" font-size="11" font-weight="bold" text-anchor="start" fill="#000">設定（[14]）</text>
<text x="1050" y="368" font-size="11" font-weight="bold" text-anchor="start" fill="#000">Q0</text>
<text x="1130" y="368" font-size="11" font-weight="bold" text-anchor="start" fill="#000">P0</text>
<text x="1200" y="368" font-size="11" font-weight="bold" text-anchor="start" fill="#000">一致する番地</text>
<text x="1320" y="368" font-size="11" font-weight="bold" text-anchor="start" fill="#000">見える版</text>
<path d="M800,374 L1480,374" fill="none" stroke="#999" stroke-width="1"/>
<text x="800" y="392" font-size="11" text-anchor="start" fill="#000">PC-9801M（1-8、3-6、出荷時）</text>
<text x="1050" y="392" font-size="11" text-anchor="start" fill="#000">LA12</text>
<text x="1130" y="392" font-size="11" text-anchor="start" fill="#000">0</text>
<text x="1200" y="392" font-size="11" text-anchor="start" fill="#000">D6000h</text>
<text x="1320" y="392" font-size="11" text-anchor="start" fill="#000">17h 版（ROM の 0000h〜）</text>
<text x="800" y="412" font-size="11" text-anchor="start" fill="#000">それ以外の機種（1-8、4-5）</text>
<text x="1050" y="412" font-size="11" text-anchor="start" fill="#000">LA12</text>
<text x="1130" y="412" font-size="11" text-anchor="start" fill="#000">1</text>
<text x="1200" y="412" font-size="11" text-anchor="start" fill="#000">D7000h</text>
<text x="1320" y="412" font-size="11" text-anchor="start" fill="#000">19h 版（ROM の 1000h〜）</text>
<text x="800" y="432" font-size="11" text-anchor="start" fill="#000">PC-9801 / XA（2-7、4-5）</text>
<text x="1050" y="432" font-size="11" text-anchor="start" fill="#000">0</text>
<text x="1130" y="432" font-size="11" text-anchor="start" fill="#000">1</text>
<text x="1200" y="432" font-size="11" text-anchor="start" fill="#000">なし</text>
<text x="1320" y="432" font-size="11" text-anchor="start" fill="#000">ROM は出ない（推測）</text>
<text x="800" y="470" font-size="10" text-anchor="start" fill="#333">LA12 は ROM の A11 でもあるので、窓の番地の上下（AB12）がそのまま版を選ぶ。</text>
<text x="800" y="486" font-size="10" text-anchor="start" fill="#333">PC-9801 / XA では P0 = 1、Q0 = 0 で P = Q にならない（P &gt; Q の出力はどこにもつながらないと見る）。</text>
<text x="800" y="502" font-size="10" text-anchor="start" fill="#333">ROM の A12 は GND なので、ROM の 2000h〜3FFFh（ダンプで空）は読まれない。</text>
<text x="800" y="518" font-size="10" text-anchor="start" fill="#333">（UX21 の拡張 ROM も A11 = AB12 で同じ割り当て。UX21 は A12 = AB13 にして 2000h〜に写しを置く）</text>
<rect x="10" y="570" width="760" height="430" rx="8" fill="#f3f3f3" stroke="#bbb"/>
<text x="20" y="590" font-size="14" font-weight="bold" text-anchor="start" fill="#000">3. 番地のラッチと ROM（3A、4A、WVF01、WVF02）</text>
