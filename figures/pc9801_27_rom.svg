<circle cx="466" cy="740" r="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="474" y="744" font-size="10" text-anchor="start" fill="#000">CE（20）</text>
<text x="417" y="744" font-size="11" text-anchor="end" fill="#0040a0">MATCH#</text>
<path d="M420,775 L462,775" fill="none" stroke="#000" stroke-width="1.3"/>
<circle cx="466" cy="775" r="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="474" y="779" font-size="10" text-anchor="start" fill="#000">OE（22）</text>
<text x="417" y="779" font-size="11" text-anchor="end" fill="#0040a0">MRC#</text>
<path d="M640,660 L664,660" fill="none" stroke="#000" stroke-width="1.3"/>
<text x="636" y="664" font-size="10" text-anchor="end" fill="#000">D0〜D7</text>
<text x="667" y="664" font-size="11" text-anchor="start" fill="#888888">（先は未確認）</text>
<text x="30" y="845" font-size="10" text-anchor="start" fill="#333">MRC# が H の間、ラッチは番地をそのまま通す。MRC# が L（メモリの読み出し）になった時の AB1〜AB12 を、読み出しが終わるまで保持する。</text>
<text x="30" y="861" font-size="10" text-anchor="start" fill="#333">ROM の A0 = AB1（16 ビットのバスで、偶数と奇数の ROM が 1 語の下位と上位のバイトを受け持つ）。A1〜A10 の入力は並びからの推測。</text>
<text x="30" y="877" font-size="10" text-anchor="start" fill="#333">ROM の CE# = MATCH#（窓の番地）、OE# = MRC#。A11 = LA12 なので、1 個の ROM の前半 2 KB が 17h 版、後半 2 KB が 19h 版になる。</text>
<rect x="780" y="570" width="710" height="430" rx="8" fill="#fffbe6" stroke="#bbb"/>
<text x="790" y="590" font-size="14" font-weight="bold" text-anchor="start" fill="#000">4. コマンドの受け取りと、読み出しの合図（8A、6C）</text>
