<text x="325" y="492" font-size="11" text-anchor="middle" fill="#0040a0">MATCH#</text>
<path d="M405,463 L405,479" fill="none" stroke="#000" stroke-width="1.3"/>
<circle cx="405" cy="459" r="4" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="405" y="450" font-size="10" text-anchor="middle" fill="#000">P&gt;Q（1）</text>
<text x="415" y="483" font-size="11" text-anchor="start" fill="#888888">（どこにもつながらないと見る）</text>
<text x="30" y="510" font-size="10" text-anchor="start" fill="#333">SW2 の反対側は GND: ON（X）で 0、OFF（O）で Q のプルアップの 1。SW2 の 1〜3 番は比較器につながらない。</text>
<text x="30" y="526" font-size="10" text-anchor="start" fill="#333">1〜7 ビット目は AB19〜AB13 = 1101011 と比べる → D6000h〜D7FFFh の 8 KB。0 ビット目（AB12 にあたる）は SW3 で決める（2.）。</text>
<text x="30" y="542" font-size="10" text-anchor="start" fill="#333">MATCH# = L で ROM 2 個が選ばれる（CE#）。P と AB は直結（ラッチを通らない）。</text>
