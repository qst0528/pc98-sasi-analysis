<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" font-family="sans-serif">
<rect width="1160" height="560" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="bold" fill="#000">PC-9801UX-31 P2（40 ピン）のピン配置（マザーボードを上から見た図、2026-10-25）</text>
<text x="40" y="60" font-size="13" fill="#333">番号は数え方。上の列が 21〜40 番、下の列が 1〜20 番（左から右へ番号が増える）。括弧内は UX-31 のつながり先。</text>
<text x="40" y="78" font-size="13" fill="#333">信号はマザーボード側の C-bus / 8237 との導通で確認（39 番は UX-31 側のみ）。* 36 番は UX-31 側で GND、マザーボード側では SASI_CONFIG#。</text>
